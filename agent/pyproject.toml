[project]
name = "crew-order-agent"
version = "0.1.0"
description = "Ziggy, the crew order agent: a Temporal Serverless Worker on Amazon Bedrock AgentCore"
requires-python = ">=3.15,<3.16"
# Exact pins, checked on PyPI on 2026-11-26; uv.lock pins the rest.
dependencies = [
    "temporalio==1.37.0",
    "temporalio-strands-agents==1.0.0",
    "strands-agents==1.67.0",
    "bedrock-agentcore==1.28.0",
    "httpx==0.29.0",
]

[dependency-groups]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
