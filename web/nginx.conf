# The web component: serves the page and proxies the API. Runs as the image's
# nginx user on 8080, so every path nginx writes is under /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Resolved at request time, so nginx starts before the API does.
  resolver ${RESOLVER} valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location ~ \.(js|css|html)$ { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=3600"; }

    location /api/ {
      set $api ${API_URL};
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }
    location = /healthz {
      set $api ${API_URL};
      proxy_pass $api;
    }
  }
}
